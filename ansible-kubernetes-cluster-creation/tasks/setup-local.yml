- name: Cleanup | Remove old helm repo configuration if exists
  become: true
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/baltocdn_com_helm_stable_debian.list
  register: old_helm_repo
- name: Cleanup | Remove old helm repo configuration
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/baltocdn_com_helm_stable_debian.list
    state: absent
  when: old_helm_repo.stat.exists
- name: Setup | Add Helm apt source
  become: true
  ansible.builtin.deb822_repository:
    name: helm
    types: deb
    uris: "https://packages.buildkite.com/helm-linux/helm-debian/any/"
    signed_by: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
    suites: any
    components: main
    architectures: amd64
- name: Setup | Apt Update/Upgrade
  ansible.builtin.apt:
    update_cache: "yes"
    upgrade: "yes"
    autoclean: "yes"
    autoremove: "yes"
    state: "latest"
  changed_when: true
- name: Setup | install required packages
  ansible.builtin.apt:
    state: 'present'
    update_cache: true
    pkg:
    - helm
    - bind9-utils
    - python3-kubernetes
