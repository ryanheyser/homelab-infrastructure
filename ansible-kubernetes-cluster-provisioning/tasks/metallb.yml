- name: Check for kubeconfig
  ansible.builtin.stat:
    path: "{{ home }}/.kube/config"
  register: kubeconfig
- name: Add Metallb repository
  when: kubeconfig.stat.exists
  kubernetes.core.helm_repository:
    kubeconfig: "{{ home }}/.kube/config"
    name: metallb
    repo_url: https://metallb.github.io/metallb
- name: Create network-system namespace
  when: kubeconfig.stat.exists
  kubernetes.core.k8s:
    kubeconfig: "{{ home }}/.kube/config"
    name: network-system
    api_version: v1
    kind: Namespace
    state: present
    definition:
      metadata:
        annotations:
          # cni.projectcalico.org/ipv4pools: '["system"]'
          metallb.io/address-pool: "system"
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
- name: Check for kubeconfig
  ansible.builtin.stat:
    path: "{{ home }}/.kube/config"
  register: kubeconfig
- name: Deploy Metallb chart
  when: kubeconfig.stat.exists
  kubernetes.core.helm:
    # renovate: registryUrl=https://metallb.github.io/metallb
    kubeconfig: "{{ home }}/.kube/config"
    name: metallb
    release_namespace: network-system
    chart_ref: metallb
    chart_version: 0.16.2
    chart_repo_url: https://metallb.github.io/metallb
    values:
      crds:
        enabled: true
      controller:
        priorityClassName: system-cluster-critical
        livenessProbe:
          enabled: false
        readinessProbe:
          enabled: false
        resources:
          limits:
            cpu: 3000m
          requests:
            cpu: 1000m
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
          - key: "node-role.kubernetes.io/etcd"
            operator: "Exists"
      speaker:
        priorityClassName: system-node-critical
        livenessProbe:
          enabled: false
        readinessProbe:
          enabled: false
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
          - key: "node-role.kubernetes.io/etcd"
            operator: "Exists"
      networkpolicies:
        enabled: true
        defaultDeny: false
      frr-k8s:
        prometheus:
          serviceMonitor:
            enabled: false
- name: Wait for metallb controller to complete
  kubernetes.core.k8s_info:
    kubeconfig: "{{ home }}/.kube/config"
    kind: Deployment
    namespace: network-system
    label_selectors:
      - app.kubernetes.io/name=metallb
      - app.kubernetes.io/component=controller
    wait: true
    wait_condition:
      type: "Available"
      status: "True"
    wait_sleep: 30
    wait_timeout: 600
  register: metallbcontrollerstatus
  until: metallbcontrollerstatus.resources[0].status.readyReplicas | int > 0
  retries: 20
  delay: 15
# MetalLB IPAddressPools, BFDProfile, BGPPeer and BGPAdvertisement now live in
# homelab-ops (network-system/metallb/config.yaml) so Flux can substitute the
# Comcast-delegated IPv6 prefix (${MLB_V6_PREFIX}). They were created here before;
# re-running these tasks would strip the IPv6 ranges until Flux re-applied them.
